services:
  - type: web
    name: music-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: MUSIC_PROVIDER
        value: spotify
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"
